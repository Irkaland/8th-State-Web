# Perf Phase 1 - static media cache policy.
#
# /media and /assets filenames are stable (NOT content-hashed), so a
# max-age=1y + immutable policy would risk serving stale artwork if a file
# is ever replaced under the same URL. Instead: a bounded 7-day browser TTL
# with 30-day stale-while-revalidate. Repeat visits within a week make zero
# requests for these assets; after that the browser revalidates in the
# background (SWR) instead of blocking. Worst-case staleness after an
# in-place asset swap is 7 days; a deploy still invalidates Netlify's edge
# cache immediately, as before.
#
# Deliberately NOT covered: HTML documents, RSC responses, /_next/* (already
# immutable), and anything the routing proxy handles - the §02/§21 routing
# contract is untouched by headers on static files (both paths are excluded
# from the proxy matcher).

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

# Real-device fix: /_next/image negotiates its output format from the request
# Accept header (WebP for modern clients, PNG/JPEG for the rest) and is served
# publicly cacheable for a week. Without a standard `Vary: Accept` any shared
# cache between us and the device - carrier/ISP proxies, corporate proxies, a
# browser disk cache shared across profiles - may store one variant and hand it
# to a client that cannot decode it, which renders as a broken image. Netlify's
# own edge keys correctly on its internal Netlify-Image-Accept header; this
# header makes the same contract explicit to every cache downstream of it.
[[headers]]
  for = "/_next/image*"
  [headers.values]
    Vary = "Accept"
